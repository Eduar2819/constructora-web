<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>SosaCraft Studio · Post Facebook</title>
<style>
  @font-face { font-family: 'IBM Plex Sans'; font-weight: 500; src: url('../../node_modules/@fontsource/ibm-plex-sans/files/ibm-plex-sans-latin-500-normal.woff2'); }
  * { box-sizing: border-box; margin: 0; }
  body { width: 1080px; height: 1080px; overflow: hidden; }
  .canvas {
    position: relative; width: 1080px; height: 1080px;
    background:
      radial-gradient(900px 600px at 85% 0%, #fbe7d9 0%, transparent 60%),
      radial-gradient(800px 700px at 0% 100%, #efe6da 0%, transparent 65%),
      linear-gradient(160deg, #f8f4ee 0%, #f1ebe2 100%);
  }
  .panel {
    position: absolute; overflow: hidden; border-radius: 14px; background: #eef2f5;
    box-shadow: 0 1px 0 rgb(255 255 255 / 0.6) inset, 0 24px 48px -20px rgb(30 29 27 / 0.28), 0 0 0 1px rgb(30 29 27 / 0.06);
  }
  .panel.phone { border-radius: 18px; }
  .panel img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: top center; }
  .brand {
    position: absolute; left: 28px; right: 28px; bottom: 0; height: 111px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .brand img { height: 66px; mix-blend-mode: multiply; margin-left: -14px; }
  .tag { text-align: right; font: 500 15px/1.5 'IBM Plex Sans', sans-serif; color: #6f675e; letter-spacing: 0.02em; }
  .tag strong { display: block; color: #1e1d1b; font-weight: 500; font-size: 17px; letter-spacing: 0; }
  .tag i { font-style: normal; color: #c4552b; }
</style>
</head>
<body>
<div class="canvas">
  <div class="panel" style="left:28px; top:28px; width:770px; height:433px;"><img src="d-entrega.png" alt=""></div>
  <div class="panel phone" style="right:28px; top:28px; width:227px; height:433px;"><img src="m-hero.png" alt=""></div>
  <div class="panel" style="left:28px; top:483px; width:770px; height:486px;"><img src="d-servicios.png" alt=""></div>
  <div class="panel phone" style="right:28px; top:483px; width:227px; height:486px;"><img src="m-proceso.png" alt=""></div>
  <div class="brand">
    <img src="sosacraft-studio-logo.png" alt="SosaCraft Studio">
    <div class="tag"><strong>Landing page para constructora</strong>Diseño web <i>·</i> Desarrollo <i>·</i> Responsive</div>
  </div>
</div>
</body>
</html>
